<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#0f2e1c"/></linearGradient>
<linearGradient id="br" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7ee787"/><stop offset=".5" stop-color="#0e4429"/><stop offset="1" stop-color="#39d353"/>
<animateTransform attributeName="gradientTransform" type="rotate" from="0 .5 .5" to="360 .5 .5" dur="4s" repeatCount="indefinite"/></linearGradient>
<linearGradient id="ic" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="24" y2="24"><stop offset="0" stop-color="#aff5b4"/><stop offset=".5" stop-color="#39d353"/><stop offset="1" stop-color="#26a641"/></linearGradient>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.1" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="halo" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4"/></filter>
</defs>
<rect x="8" y="8" width="48" height="48" rx="14" fill="#39d353" filter="url(#halo)" opacity=".3"><animate attributeName="opacity" values=".12;.5;.12" dur="2.4s" repeatCount="indefinite"/></rect>
<rect x="5" y="5" width="54" height="54" rx="15" fill="url(#bg)" stroke="url(#br)" stroke-width="2"/>
<g><animateTransform attributeName="transform" type="translate" values="0 0;0 -1.5;0 0" dur="3s" repeatCount="indefinite"/>
<g transform="translate(14 14) scale(1.5)" fill="none" stroke="url(#ic)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"><rect x="5" y="2" width="15" height="20" rx="2"/><path d="M9 7h7M9 11h7M9 15h4M3 6h3M3 12h3M3 18h3"/></g></g>
</svg>